name: Publish Waarp preview
# One-off preview intent on main, or an explicit manual retry. Never marks a build stable.
on:
  push:
    branches: [main]
    paths:
      - 'release/preview-2026-11-18.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Preview tag (must target this exact commit)'
        required: true
        type: string
        default: 'preview-2026-11-22-r2'
permissions:
  contents: write
concurrency:
  group: waarp-preview-${{ github.ref }}
  # A newer preview intent supersedes an unfinished attempt; its draft remains tied to its original commit.
  cancel-in-progress: true
jobs:
  native-routing:
    name: Native route preflight on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run engine:fetch
      - name: Compile the actual native route gate
        run: node --input-type=module -e "import { build } from 'esbuild'; await build({entryPoints:['test/route-native.check.ts'],bundle:true,platform:'node',outfile:'out/test/route-native.check.js',sourcemap:true,alias:{electron:'./test/stubs/electron.ts'}})"
      - name: Require same-session TCP, UDP and DNS before preparing the release
        env:
          WAARP_NATIVE_SWITCH_TEST: '1'
        run: node --enable-source-maps out/test/route-native.check.js
  prepare:
    needs: native-routing
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.intent.outputs.tag }}
      windows: ${{ steps.intent.outputs.windows }}
      android: ${{ steps.intent.outputs.android }}
      android_enabled: ${{ steps.intent.outputs.android_enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate exact preview identity and create unpublished draft
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: node scripts/release-preview.mjs prepare
  windows:
    name: Validate + upload Windows portable
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run test:performance
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui
        env:
          WAARP_UI_SCREENSHOTS: out/ui
      - name: Retain reviewable UI previews in the job log
        if: always()
        shell: pwsh
        run: |
          foreach ($waarpPreview in @('app-public-server-picker.png', 'app-public-server-picker-pages.png', 'saved-server-picker-pages.png', 'public-check-failure.png', 'stability-failed.png', 'failure-1.png', 'atlas-picker-active-preview-1240.png', 'atlas-picker-900.png', 'atlas-public-full-pool-unknown.png', 'atlas-fallback-list.png', 'atlas-file-origin.png', 'atlas-saved-desktop-1920.png', 'atlas-public-desktop-1920.png', 'quality-context-1240.png', 'quality-context-900.png', 'diagnostics-main-900.png', 'diagnostics-main-1240.png')) {
            $waarpPreviewPath = Join-Path 'out/ui' $waarpPreview
            if (Test-Path $waarpPreviewPath) { Write-Output ('WAARP_UI_PREVIEW ' + $waarpPreview + ' ' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($waarpPreviewPath))) }
          }
          if (Test-Path 'out/ui/stability-metrics.json') { Get-Content 'out/ui/stability-metrics.json' }
      - run: npm run engine:fetch
      - name: Verify actual TCP and UDP selector continuity on the pinned core
        run: node out/test/continuity-native.check.js
        env:
          WAARP_CONTINUITY_NATIVE_TEST: '1'
      - run: node out/test/slots.check.js
      - run: node out/test/links.check.js
      - run: node out/test/awg-import.check.js
      - run: node out/test/masque.check.js
      - name: Native routing remains live across selector updates
        env:
          WAARP_NATIVE_SWITCH_TEST: '1'
        run: node out/test/route-native.check.js
      - run: npm run dist
      - run: npm run package:verify
      - name: Verify portable lifecycle ownership and evidence guards
        run: node --test scripts/test-portable-lifecycle.test.mjs
      - name: Exercise the release EXE, persisted profile and bundled icons
        run: node scripts/test-portable-lifecycle.mjs --disposable-windows
      - name: Accept actual packaged UI, automatic public checks and live VPN session
        env:
          WAARP_DESKTOP_ACCEPTANCE: '1'
        run: node scripts/accept-desktop.mjs
      - name: Retain actual packaged desktop evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'out/desktop-acceptance/public-catalog-windows.json') { Get-Content 'out/desktop-acceptance/public-catalog-windows.json' }
          foreach ($waarpPreview in @(Get-ChildItem 'out/desktop-acceptance' -Filter '*.png' -ErrorAction SilentlyContinue)) {
            Write-Output ('WAARP_DESKTOP_PREVIEW ' + $waarpPreview.Name + ' ' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($waarpPreview.FullName)))
          }
      # Reach the real catalog before spending the full lifecycle budget on a
      # candidate. Publication still requires the unchanged 50-cycle gate.
      - run: npm run test:live -- --disposable-windows
      - name: Check and attach Windows EXE + SHA-256 directly to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WINDOWS_VERSION: ${{ needs.prepare.outputs.windows }}
        run: |
          $ErrorActionPreference = 'Stop'
          $waarpPortableFiles = @(Get-ChildItem -Path dist -Filter "Waarp-$($env:WINDOWS_VERSION)-portable.exe" -File)
          if ($waarpPortableFiles.Count -ne 1) { throw "Expected exactly one Windows $env:WINDOWS_VERSION portable EXE" }
          $exe = $waarpPortableFiles[0]
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/SHA256SUMS-windows.txt'), "$hash  $($exe.Name)`n")
          gh release download v0.4.0 --pattern 'sing-box-lx-1.14.2-lx.11-src.tar.gz' --dir dist --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Engine source download failed' }
          $waarpSourceHash = (Get-FileHash 'dist/sing-box-lx-1.14.2-lx.11-src.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($waarpSourceHash -ne 'cfe0234e422a61d5ace36798e76b2466e6773565745c493925fd14aafbfb615c') { throw 'Engine source digest differs' }
          Copy-Item 'out/validation/package-integrity.json' 'dist/package-integrity-windows.json'
          gh release upload "$env:RELEASE_TAG" "$($exe.FullName)" 'dist/SHA256SUMS-windows.txt' 'dist/sing-box-lx-1.14.2-lx.11-src.tar.gz' 'dist/package-integrity-windows.json' 'out/validation/package-inventory.txt' 'out/validation/portable-lifecycle.json' 'out/desktop-acceptance/public-catalog-windows.json' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows draft upload failed' }
  android:
    name: Validate + upload Android debug APKs
    needs: prepare
    if: needs.prepare.outputs.android_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reclaim unused tools only on the disposable GitHub-hosted builder
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/swift
          mkdir -p "$RUNNER_TEMP/waarp-native-tmp"
          echo "TMPDIR=$RUNNER_TEMP/waarp-native-tmp" >> "$GITHUB_ENV"
          df -h /
      - name: Check Android build and evidence script syntax
        run: python3 -m py_compile scripts/android-*.py
      - name: Verify APK inventory accounting and replayable reports
        run: python3 scripts/android-package-inventory-test.py
      - name: Verify instrumentation failure evidence and shared result parsing
        run: python3 scripts/android-instrument-test.py
      - name: Verify current and archived native crash evidence handling
        run: python3 scripts/android-crash-evidence-test.py
      - name: Verify scoped foreground frame and trace evidence rejection
        run: python3 scripts/android-foreground-proof-test.py
      - name: Verify reviewed image and bounded ftrace preparation evidence
        run: python3 scripts/android-ftrace-prepare-test.py
      - name: Verify API 29 emulator preparation ordering and failure handling
        run: python3 scripts/android-emulator-prepare-test.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Verify IME visibility evidence fixtures on the host JVM
        run: |
          mkdir -p "$RUNNER_TEMP/waarp-ime-evidence"
          javac --release 17 -d "$RUNNER_TEMP/waarp-ime-evidence" android/acceptance/src/main/java/local/waarp/android/acceptance/ImeVisibility.java android/acceptance/checks/ImeVisibilityChecks.java
          java -cp "$RUNNER_TEMP/waarp-ime-evidence" local.waarp.android.acceptance.ImeVisibilityChecks
      - name: Verify probe network state fixtures on the host JVM
        run: |
          mkdir -p "$RUNNER_TEMP/waarp-probe-network"
          javac --release 17 -d "$RUNNER_TEMP/waarp-probe-network" android/app/src/androidTest/java/local/waarp/android/core/ProbeNetworkState.java android/app/checks/ProbeNetworkStateChecks.java
          java -cp "$RUNNER_TEMP/waarp-probe-network" local.waarp.android.core.ProbeNetworkStateChecks
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          # Reuse downloaded dependencies across updates of a trusted PR.
          # Fork PRs and non-default-branch dispatches retain read-only caches.
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
      - name: Install pinned Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'ndk;28.2.13676358'
      - name: Restore native output only for identical pinned source and verification inputs
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/android-core
          key: waarp-native-source-v2-${{ hashFiles('android/native*.json', 'android/native-patches/**', 'android/app/src/main/res/raw/engine_integrity.json', 'scripts/android-core-build.py', 'scripts/android-verify.py', 'scripts/android-native-notices.py') }}
      - name: Restore the previous exact source cache only for mandatory revalidation
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: native-legacy
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/android-core
          key: waarp-native-source-v1-${{ hashFiles('android/native*.json', 'android/native-patches/**', 'scripts/android-core-build.py') }}
      - name: Build native core from source and require the frozen AAR and native pins
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.native-legacy.outputs.cache-hit != 'true'
        run: python3 scripts/android-core-build.py --output out/android-core
      - name: Verify restored or newly built native provenance and AAR
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          lock=json.loads(Path('android/native-source.json').read_text())
          pin=json.loads(Path('android/app/src/main/res/raw/engine_integrity.json').read_text())
          report=json.loads(Path('out/android-core/build-report.json').read_text())
          expected=hashlib.sha256(json.dumps(lock,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert expected == pin['sourceBuild']['inputsSha256'] == report['sourceInputsSha256']
          assert report['passed'] and report['aarSha256'] == pin['sha256']
          print('Verified native source inputs:',expected)
          PY
          mkdir -p android/app/libs
          cp out/android-core/libbox.aar android/app/libs/libbox.aar
          node scripts/android-core.mjs verify
      - name: Cache the verified native build for identical inputs
        if: steps.native-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/android-core
          key: waarp-native-source-v2-${{ hashFiles('android/native*.json', 'android/native-patches/**', 'android/app/src/main/res/raw/engine_integrity.json', 'scripts/android-core-build.py', 'scripts/android-verify.py', 'scripts/android-native-notices.py') }}
      - name: Build actual APKs and verify their signatures, engine and 16 KB alignment
        run: node scripts/android-build.mjs
      - name: Require real passing JVM regression results
        run: python3 scripts/android-test-report.py android/app/build/test-results/testDebugUnitTest --report out/android/unit-tests.json
      # This gate uses the actual APKs in this workspace. GitHub artifact-storage
      # quota failures must not prevent the critical native-TUN regression proof.
      - name: Enable KVM for focused native route and feedback acceptance
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare the pinned emulator action for focused acceptance
        run: python3 scripts/android-emulator-action-prepare.py --report out/android/route-smoke/emulator-action-provenance.json
      - name: Require actual TUN continuity and stable success feedback before uploading artifacts
        uses: ./out/android-emulator-action
        with:
          api-level: 35
          system-image-api-level: '35'
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            python3 scripts/android-install.py --serial emulator-5554 --with-tests
            bash scripts/android-emulator-locale.sh
            python3 scripts/android-instrument.py --serial emulator-5554 --disposable-emulator --expect-page-size 4096 --route-smoke --timeout 300 --output out/android/route-smoke
            python3 scripts/android-instrument.py --serial emulator-5554 --disposable-emulator --expect-page-size 4096 --ui-gallery --timeout 360 --output out/android/gallery
      - name: Retain actual Android gallery captures in the job log
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          root = Path('out/android/gallery/ui-screenshots')
          for name in ['01-home-empty.png','02-settings.png','03-saved-route.png','04-groups.png','05-atlas-local.png','06-atlas-large-font.png']:
              for path in root.rglob(name):
                  print('WAARP_ANDROID_PREVIEW '+name+' '+base64.b64encode(path.read_bytes()).decode('ascii'))
          # These failure captures contain only the gallery's synthetic UI fixtures.
          # Keep the real obstruction visible even when Actions artifact storage is full.
          for path in sorted(root.rglob('failure-*.png'))[:12]:
              if path.stat().st_size <= 1_500_000:
                  print('WAARP_ANDROID_FAILURE_PREVIEW '+path.name+' '+base64.b64encode(path.read_bytes()).decode('ascii'))
          diagnostics = sorted(path for path in root.rglob('failure-*') if path.suffix in {'.txt', '.json'})
          for path in diagnostics[:20]:
              print('WAARP_ANDROID_FAILURE_TEXT '+path.name)
              print(path.read_text(errors='replace')[:100_000])
              print('WAARP_ANDROID_FAILURE_TEXT_END')
          PY
      - name: Print build evidence before artifact upload
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['out/android/unit-tests.json','out/android/artifacts.json','out/android-core/build-report.json','out/android/route-smoke/result.json','out/android/gallery/result.json']:
              path=Path(name)
              if path.is_file(): print(name+'\n'+path.read_text())
          PY
      - name: Check and attach only installable Android debug APKs + SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ANDROID_VERSION: ${{ needs.prepare.outputs.android }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(out/android/waarp-android-"$ANDROID_VERSION"-*-debug.apk)
          test "${#apks[@]}" -eq 3 || { echo 'Expected precisely three verified Android debug APKs'; exit 1; }
          ( cd out/android && sha256sum waarp-android-"$ANDROID_VERSION"-*-debug.apk > SHA256SUMS-android-debug.txt )
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          report = json.loads(Path('out/android/artifacts.json').read_text())
          report['sourceCommit'] = os.environ['GITHUB_SHA']
          Path('out/android/android-artifacts.json').write_text(json.dumps(report, indent=2)+'\n')
          PYREPORT
          gh release upload "$RELEASE_TAG" "${apks[@]}" out/android/SHA256SUMS-android-debug.txt out/android/android-artifacts.json --clobber
  publish:
    name: Publish preview after the declared platform gates pass
    needs: [prepare, windows, android]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.windows.result == 'success' && (needs.prepare.outputs.android_enabled != 'true' || needs.android.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify uploaded bytes, source identity and complete installable asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/release-preview.mjs publish
