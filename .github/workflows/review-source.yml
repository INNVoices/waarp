name: Review source snapshot (temporary)
on:
  push:
    paths: ['.github/workflows/review-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5c1bb7731bd7129a15320fe03b18c5ad3d064bb9
          persist-credentials: false
      - name: Package tracked source only
        run: git archive --format=zip --output=review-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: waarp-review-source-5c1bb773
          path: review-source.zip
          retention-days: 1
          if-no-files-found: error
