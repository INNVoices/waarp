name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    name: checks (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate production task map and dependency graph
        run: |
          python scripts/production-roadmap.py check
          python scripts/production-roadmap-test.py
      - name: Check local APK builder with Windows PowerShell
        shell: powershell
        run: .\scripts\build.ps1 -SelfTest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        id: offline_checks
      - run: npm run check
      - name: Check configuration compiler performance
        run: npm run test:performance
      - run: npm run build
      - name: Install browser for UI regressions
        run: npx playwright install chromium
      - name: Verify production UI and recovery controls
        run: npm run test:ui
        env:
          WAARP_UI_SCREENSHOTS: out/ui
      - name: Fetch and verify pinned Windows engine
        id: engine_download
        if: ${{ !cancelled() && steps.offline_checks.outcome == 'success' }}
        run: npm run engine:fetch
      - name: Verify actual TCP and UDP selector continuity on the pinned core
        if: ${{ !cancelled() && steps.engine_download.outcome == 'success' }}
        run: node out/test/continuity-native.check.js
        env:
          WAARP_CONTINUITY_NATIVE_TEST: '1'
      - name: Validate live card slot configs with the pinned engine
        run: node out/test/slots.check.js
      - name: Validate Hysteria2 import with the pinned engine
        run: node out/test/links.check.js
      - name: Validate AmneziaWG 3 import with the pinned engine
        run: node out/test/awg-import.check.js
      - name: Validate MASQUE modes with the pinned engine
        run: node out/test/masque.check.js
      - name: Verify route changes preserve the native process and unrelated TCP stream
        run: node out/test/route-native.check.js
        env:
          WAARP_NATIVE_SWITCH_TEST: '1'
      - name: Verify 50 native TUN lifecycle cycles
        run: npm run test:live -- --disposable-windows
      - name: Build portable Windows package
        run: npx electron-builder --win portable --publish never
      - name: Verify packaged runtime and engine checksums
        run: npm run package:verify
      - name: Verify portable lifecycle ownership and evidence guards
        run: node --test scripts/test-portable-lifecycle.test.mjs
      - name: Exercise the built portable EXE, persisted profile and normal exit
        run: node scripts/test-portable-lifecycle.mjs --disposable-windows
      - name: Retain feature previews and native evidence in the job log
        if: always()
        shell: pwsh
        run: |
          foreach ($waarpPreview in @('atlas-picker-active-preview-1240.png', 'atlas-picker-900.png', 'atlas-public-full-pool-unknown.png', 'atlas-fallback-list.png', 'atlas-file-origin.png', 'quality-context-1240.png', 'quality-context-900.png', 'failure-1.png')) {
            $waarpPreviewPath = Join-Path 'out/ui' $waarpPreview
            if ((Test-Path $waarpPreviewPath) -and (Get-Item $waarpPreviewPath).Length -le 1500000) { Write-Output ('WAARP_UI_PREVIEW ' + $waarpPreview + ' ' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($waarpPreviewPath))) }
          }
          if (Test-Path 'out/validation/continuity-native.json') { Get-Content 'out/validation/continuity-native.json' }
      - name: Retain UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waarp-ui-evidence
          path: out/ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain native and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waarp-validation-evidence
          path: out/validation
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain portable build
        uses: actions/upload-artifact@v4
        with:
          name: waarp-windows-portable
          path: dist/Waarp-*-portable.exe
          if-no-files-found: error
          retention-days: 7
  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent from functional/build checks: an unresolved upstream advisory stays red
    # without hiding which current-source regressions or packages actually passed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Audit shipped JavaScript dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit complete pinned build toolchain
        run: npm audit --audit-level=moderate
  userspace-awg:
    name: AWG protocol and crash (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: test/userspace-awg/go.sum
      - name: Check bounded AWG harness lifecycle regressions
        working-directory: test/userspace-awg
        run: go test -count=1 -timeout=90s -v ./...
      - name: Check sanitized AWG crash-progress evidence
        run: python3 -m unittest discover -s test/userspace-awg -p test_crash_check.py -v
      - name: Build pinned userspace AWG library harness
        working-directory: test/userspace-awg
        run: go build -trimpath -buildvcs=false -o awg-userspace-audit .
      - name: Check encrypted loopback lifecycle and crash recovery
        working-directory: test/userspace-awg
        run: |
          mkdir -p ../../out/validation
          ./awg-userspace-audit --self-test | tee ../../out/validation/awg-loopback.json
          python3 crash-check.py --binary ./awg-userspace-audit --report ../../out/validation/awg-crash.json
          go version -m ./awg-userspace-audit > ../../out/validation/awg-build.txt
      - name: Retain AWG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waarp-awg-evidence
          path: out/validation
          if-no-files-found: error
          retention-days: 7
