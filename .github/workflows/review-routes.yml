name: Route switch audit (temporary)
on:
  push:
    paths: ['.github/workflows/review-routes.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0982aad18ed4f26341fb754d8637515d99dfaf36
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run engine:fetch
      - run: npm test
      - name: Real TUN route changes preserve the process and unrelated stream
        env:
          WAARP_NATIVE_SWITCH_TEST: '1'
        run: node out/test/route-native.check.js
      - run: npm run check
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui
