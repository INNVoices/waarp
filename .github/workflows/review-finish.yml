name: Client regression completion (temporary)
on:
  push:
    paths: ['.github/workflows/review-finish.yml']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 53886a49bba8ceb822d5321b608ddd1ac4c4c6c6
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python scripts/review-finish-prep.py
      - run: git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run engine:fetch
      - run: npm test
      - name: Native TUN route transitions
        env:
          WAARP_NATIVE_SWITCH_TEST: '1'
        run: node out/test/route-native.check.js
      - run: npm run check
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:ui
      - name: Preserve reviewed source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          for path in json.loads(Path('out/final-prep-files.json').read_text(encoding='utf-8')):
              data={'content':Path(path).read_text(encoding='utf-8'),'encoding':'utf-8'}
              r=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--method','POST','--input','-'],input=json.dumps(data),encoding='utf-8',capture_output=True)
              if r.returncode: raise RuntimeError(r.stderr)
              print('FINISH_FILE',path,json.loads(r.stdout)['sha'],flush=True)
          PY
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 53886a49bba8ceb822d5321b608ddd1ac4c4c6c6
          persist-credentials: false
      - run: python scripts/review-finish-prep.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Install SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'ndk;28.2.13676358'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: core-cache
        with:
          path: out/android-core
          key: waarp-native-source-v1-${{ hashFiles('android/native*.json', 'android/native-patches/**', 'scripts/android-core-build.py') }}
      - if: steps.core-cache.outputs.cache-hit != 'true'
        run: python3 scripts/android-core-build.py --output out/android-core
      - run: mkdir -p android/app/libs && cp out/android-core/libbox.aar android/app/libs/libbox.aar
      - run: node scripts/android-build.mjs
      - run: python3 scripts/android-test-report.py android/app/build/test-results/testDebugUnitTest --report out/android/unit-tests.json
      - name: Preserve reviewed source and test summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          print(Path('out/android/unit-tests.json').read_text(encoding='utf-8'))
          for path in json.loads(Path('out/final-prep-files.json').read_text(encoding='utf-8')):
              data={'content':Path(path).read_text(encoding='utf-8'),'encoding':'utf-8'}
              r=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--method','POST','--input','-'],input=json.dumps(data),encoding='utf-8',capture_output=True)
              if r.returncode: raise RuntimeError(r.stderr)
              print('FINISH_FILE',path,json.loads(r.stdout)['sha'],flush=True)
          PY
