name: Prepared profiles and route regression validation (temporary)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/network-pass.yml'
permissions:
  contents: read
concurrency:
  group: network-pass-b-validation
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6251b77667f56ea07aeadaa7d310ba413b89f24f
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python scripts/apply-network-pass.py
      - run: git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run engine:fetch
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run test:performance
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run test:live -- --disposable-windows
      - name: Publish immutable candidate objects (does not move main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          def api(endpoint, data=None):
              args = ['gh', 'api', f'repos/{repo}/{endpoint}']
              if data is not None: args += ['--method', 'POST', '--input', '-']
              p = subprocess.run(args, input=None if data is None else json.dumps(data), text=True, encoding='utf-8', check=True, capture_output=True)
              return json.loads(p.stdout)
          paths = json.loads(Path('out/maintenance-paths.json').read_text(encoding='utf-8'))
          entries = []
          for path in paths:
              raw = Path(path).read_text(encoding='utf-8')
              sha = api('git/blobs', {'content': raw, 'encoding': 'utf-8'})['sha']
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
              print('CANDIDATE_FILE', path, sha)
          for path in ['scripts/apply-network-pass.py', 'scripts/network-pass-reviewed.xz', '.github/workflows/network-pass.yml']:
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('git/trees', {'base_tree': api('git/commits/'+base)['tree']['sha'], 'tree': entries})['sha']
          commit = api('git/commits', {'message': 'feat: add prepared MASQUE profiles and reversible compatibility controls', 'tree': tree, 'parents': [base]})['sha']
          print('VALIDATED_CANDIDATE_COMMIT=' + commit)
          print('VALIDATED_CANDIDATE_TREE=' + tree)
          PY
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6251b77667f56ea07aeadaa7d310ba413b89f24f
          persist-credentials: false
      - run: python scripts/apply-network-pass.py
      - name: Reclaim only unused tools on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Install pinned SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'ndk;28.2.13676358'
      - name: Restore exact verified native core
        id: core-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/android-core
          key: waarp-native-source-v1-${{ hashFiles('android/native*.json', 'android/native-patches/**', 'scripts/android-core-build.py') }}
      - if: steps.core-cache.outputs.cache-hit != 'true'
        run: python3 scripts/android-core-build.py --output out/android-core
      - name: Save built native core for identical pins
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: out/android-core
          key: waarp-native-source-v1-${{ hashFiles('android/native*.json', 'android/native-patches/**', 'scripts/android-core-build.py') }}
      - name: Install the exact pinned AAR for the application build
        run: |
          mkdir -p android/app/libs
          cp out/android-core/libbox.aar android/app/libs/libbox.aar
      - run: node scripts/android-build.mjs
      - run: python3 scripts/android-test-report.py android/app/build/test-results/testDebugUnitTest --report out/android/unit-tests.json
      - name: Print exact source hashes and test evidence
        if: always()
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = Path('out/maintenance-paths.json')
          if manifest.exists():
              for p in json.loads(manifest.read_text(encoding='utf-8')):
                  print('CANDIDATE_FILE', p, subprocess.check_output(['git','hash-object',p],text=True).strip())
          for p in ['out/android/unit-tests.json','out/android/artifacts.json']:
              if Path(p).exists(): print(p, Path(p).read_text(encoding='utf-8'))
          PY
