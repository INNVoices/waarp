name: Network pass validation (temporary)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-network-pass.py'
      - '.github/workflows/network-pass.yml'
permissions:
  contents: read
concurrency:
  group: network-pass-validation
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 scripts/apply-network-pass.py
      - run: git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run test:performance
      - name: Publish immutable candidate objects (does not move main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          base = os.environ['GITHUB_SHA']
          def api(endpoint, data=None):
              args = ['gh', 'api', f'repos/{repo}/{endpoint}']
              if data is not None: args += ['--method', 'POST', '--input', '-']
              p = subprocess.run(args, input=None if data is None else json.dumps(data), text=True, check=True, capture_output=True)
              return json.loads(p.stdout)
          paths = json.loads(Path('out/maintenance-paths.json').read_text())
          entries = []
          for path in paths:
              sha = api('git/blobs', {'content': Path(path).read_text(), 'encoding': 'utf-8'})['sha']
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha})
              print('CANDIDATE_FILE', path, sha)
          for path in ['scripts/apply-network-pass.py', '.github/workflows/network-pass.yml']:
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('git/trees', {'base_tree': api('git/commits/'+base)['tree']['sha'], 'tree': entries})['sha']
          commit = api('git/commits', {'message': 'fix: preserve VPN intent across inert route edits and polish Android feedback', 'tree': tree, 'parents': [base]})['sha']
          print('VALIDATED_CANDIDATE_COMMIT=' + commit)
          print('VALIDATED_CANDIDATE_TREE=' + tree)
          PY
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 scripts/apply-network-pass.py
      - name: Reclaim only unused tools on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Install pinned SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'ndk;28.2.13676358'
      - run: python3 scripts/android-core-build.py --output out/android-core
      - run: node scripts/android-build.mjs
      - run: python3 scripts/android-test-report.py android/app/build/test-results/testDebugUnitTest --report out/android/unit-tests.json
      - name: Print exact source hashes and test evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for p in json.loads(Path('out/maintenance-paths.json').read_text()):
              print('CANDIDATE_FILE', p, subprocess.check_output(['git','hash-object',p],text=True).strip())
          for p in ['out/android/unit-tests.json','out/android/artifacts.json']:
              if Path(p).exists(): print(p, Path(p).read_text())
          PY
