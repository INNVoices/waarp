name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/android-*'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/android-*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit, lint and APK integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Build actual APKs and verify their signatures, engine and 16 KB alignment
        run: node scripts/android-build.mjs
      - name: Require real passing JVM regression results
        run: python3 scripts/android-test-report.py android/app/build/test-results/testDebugUnitTest --report out/android/unit-tests.json
      - name: Upload installable debug APKs and explicitly unsigned release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waarp-android-apks
          path: out/android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Upload emulator inputs once for all API levels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waarp-android-emulator-inputs
          path: |
            out/android/*-x86_64-debug.apk
            out/android/waarp-android-debug-instrumentation.apk
            out/android/artifacts.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waarp-android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/mapping/release/
            out/android/*.json
          retention-days: 14

  instrumented:
    name: Native VPN API ${{ matrix.api }} / ${{ matrix.page-size }}B
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: google_apis
            page-size: 4096
          - api: 35
            target: google_apis
            page-size: 4096
          - api: 36
            target: google_apis_ps16k
            page-size: 16384
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: waarp-android-emulator-inputs
          path: out/android
      - name: Install verification tools
        run: sdkmanager 'build-tools;35.0.0' 'platform-tools'
      - name: Enable KVM on the disposable GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start local real HTTP integration fixture
        run: |
          mkdir -p out/android/device-tests
          python3 scripts/android-http-fixture.py --port 18080 > out/android/device-tests/http-fixture.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  assert urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=1).status == 200
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('The local HTTP fixture did not become ready.')
          PY
      - name: Exercise actual native engine, VPN TUN, routes and UI on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            python3 scripts/android-install.py --with-tests
            python3 scripts/android-instrument.py --expect-page-size ${{ matrix.page-size }} --output out/android/device-tests
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waarp-android-api-${{ matrix.api }}-${{ matrix.page-size }}-runtime
          path: out/android/device-tests/
          if-no-files-found: error
          retention-days: 14
